<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Disponibilidad — Profesores</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink-950: #0c0a1d;
    --ink-900: #151230;
    --ink-800: #1e1a45;
    --ink-700: #2a2560;
    --ink-600: #3d3685;
    --ink-500: #524aab;
    --ink-400: #7068cc;
    --ink-300: #9d97de;
    --ink-200: #c4c0ed;
    --ink-100: #e0def5;
    --ink-50:  #f0eff9;

    --mint-600: #0d7358;
    --mint-500: #10956f;
    --mint-100: #d5f2e8;
    --mint-50:  #edfaf4;

    --ember-600: #a8421a;
    --ember-500: #d85a30;
    --ember-100: #fde1d4;
    --ember-50:  #fef2ec;

    --honey-600: #8a5a10;
    --honey-100: #fcecc4;
    --honey-50:  #fef7e6;

    --surface: #f6f5fc;
    --surface-card: #ffffff;
    --border-subtle: #e4e1f3;
    --border-faint: #eeedfa;
    --text-primary: #0c0a1d;
    --text-secondary: #6b6893;
    --text-muted: #9895b5;

    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-display: 'Instrument Serif', Georgia, serif;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;

    --shadow-sm: 0 1px 3px rgba(12,10,29,0.04), 0 1px 2px rgba(12,10,29,0.03);
    --shadow-md: 0 4px 12px rgba(12,10,29,0.06), 0 1px 4px rgba(12,10,29,0.04);
    --shadow-tooltip: 0 8px 24px rgba(12,10,29,0.18), 0 2px 8px rgba(12,10,29,0.1);

    --heat-0: var(--surface);
    --heat-1: #e8e5f6;
    --heat-2: #d1cbf0;
    --heat-3: #b5adea;
    --heat-4: #9690e0;
    --heat-5: #7068cc;
    --heat-6: #524aab;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: var(--font-body);
    background: var(--surface);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── HEADER ────────────────────────────────────────────────────── */
  .header {
    background: var(--ink-900);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--ink-500), var(--mint-500), var(--ink-500));
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-brand i { color: var(--ink-300); font-size: 20px; }
  .header-brand h1 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
    color: #fff;
    font-style: italic;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-meta {
    font-size: 11px;
    color: var(--ink-400);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .btn-refresh {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--ink-600);
    background: transparent;
    color: var(--ink-300);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh:hover { background: var(--ink-800); color: #fff; border-color: var(--ink-400); }
  .btn-refresh i { font-size: 14px; }
  .btn-refresh.loading i { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── LAYOUT ────────────────────────────────────────────────────── */
  .main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  /* ─── STATUS BANNER ─────────────────────────────────────────────── */
  .status-banner {
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    animation: fadeIn 0.3s var(--ease-out);
  }
  .status-banner.info {
    display: block;
    background: var(--honey-50);
    color: var(--honey-600);
    border: 1px solid var(--honey-100);
  }
  .status-banner.error {
    display: block;
    background: var(--ember-50);
    color: var(--ember-600);
    border: 1px solid var(--ember-100);
  }
  .status-banner.demo {
    display: block;
    background: var(--ink-50);
    color: var(--ink-600);
    border: 1px solid var(--ink-100);
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

  /* ─── KPI CARDS ─────────────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  }
  .kpi:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .kpi-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .kpi-label i { font-size: 14px; color: var(--ink-400); }
  .kpi-value {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1;
  }
  .kpi-value--text {
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 600;
    margin-top: 4px;
  }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* ─── SECTION HEADS ─────────────────────────────────────────────── */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title i { color: var(--ink-500); font-size: 17px; }
  .section-controls { display: flex; align-items: center; gap: 16px; }

  /* ─── FILTERS ───────────────────────────────────────────────────── */
  .filters { display: flex; gap: 8px; align-items: center; }
  .filter-btn {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-subtle);
    background: var(--surface-card);
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s var(--ease-out);
    letter-spacing: 0.02em;
  }
  .filter-btn:hover { border-color: var(--ink-300); color: var(--ink-600); }
  .filter-btn[aria-pressed="true"] {
    background: var(--ink-700);
    color: #fff;
    border-color: var(--ink-700);
  }

  /* ─── LEGEND ────────────────────────────────────────────────────── */
  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .legend-item { display: flex; align-items: center; gap: 3px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ─── HEATMAP ───────────────────────────────────────────────────── */
  .heatmap-wrap {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
    -webkit-overflow-scrolling: touch;
  }
  .heatmap-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 680px; }
  .heatmap-table th {
    background: var(--ink-50);
    color: var(--ink-700);
    font-weight: 600;
    font-size: 11px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid var(--border-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .heatmap-table th.col-module { text-align: left; min-width: 140px; padding-left: 16px; }
  .heatmap-table td { padding: 0; border: 1px solid var(--border-faint); }
  .heatmap-table td.cell-module { padding: 8px 8px 8px 16px; background: var(--surface-card); }
  .mod-name { font-weight: 600; font-size: 12px; color: var(--text-primary); }
  .mod-time { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

  .heat-cell {
    width: 100%; height: 52px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: default;
    transition: filter 0.12s var(--ease-out);
  }
  .heat-cell:hover { filter: brightness(0.93); }
  .heat-cell .count { font-size: 17px; font-weight: 600; line-height: 1; }
  .heat-cell .pct { font-size: 10px; margin-top: 2px; opacity: 0.7; font-weight: 500; }

  .h0 { background: var(--heat-0); color: var(--text-muted); }
  .h1 { background: var(--heat-1); color: var(--ink-500); }
  .h2 { background: var(--heat-2); color: var(--ink-600); }
  .h3 { background: var(--heat-3); color: var(--ink-700); }
  .h4 { background: var(--heat-4); color: var(--ink-900); }
  .h5 { background: var(--heat-5); color: #fff; }
  .h6 { background: var(--heat-6); color: #fff; }

  .row-totals td { background: var(--ink-50); font-weight: 600; font-size: 12px; }
  .row-totals td.cell-total-label { color: var(--ink-700); padding-left: 16px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  .row-totals td.cell-total-val { text-align: center; color: var(--ink-600); padding: 8px; }
  .cell-mod-total { text-align: center; padding: 4px 8px; background: var(--surface-card); }
  .cell-mod-total-count { font-weight: 600; font-size: 13px; color: var(--ink-600); }
  .cell-mod-total-pct { font-size: 10px; color: var(--text-muted); }
  .cell-grand-total { color: var(--ink-800) !important; font-weight: 700 !important; }

  /* ─── BOTTOM CARDS ──────────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title i { color: var(--ink-500); font-size: 16px; }

  .prof-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-faint); }
  .prof-row:last-child { border-bottom: none; }
  .prof-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ink-50); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--ink-500); flex-shrink: 0; }
  .prof-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .prof-area { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .prof-slots { margin-left: auto; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-xl); letter-spacing: 0.02em; }
  .badge-high { background: var(--mint-50); color: var(--mint-600); }
  .badge-med  { background: var(--ink-50); color: var(--ink-600); }
  .badge-low  { background: var(--ember-50); color: var(--ember-600); }

  .bar-chart { margin-top: 8px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 12px; }
  .bar-day { width: 32px; color: var(--text-muted); flex-shrink: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; }
  .bar-track { flex: 1; height: 18px; background: var(--ink-50); border-radius: var(--radius-sm); overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--ink-500), var(--ink-600)); border-radius: var(--radius-sm); transition: width 0.4s var(--ease-out); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
  .bar-fill span { font-size: 10px; color: #fff; font-weight: 600; }
  .bar-fill--inactive { background: var(--ink-100); opacity: 0.5; }
  .bar-val { width: 28px; text-align: right; font-weight: 600; color: var(--ink-700); font-size: 12px; }
  .bar-val--inactive { color: var(--text-muted); opacity: 0.5; }

  /* ─── TOOLTIP ───────────────────────────────────────────────────── */
  .tooltip {
    position: fixed;
    background: var(--ink-900);
    color: #fff;
    border-radius: var(--radius-md);
    padding: 8px 16px;
    font-size: 12px;
    pointer-events: none;
    z-index: 999;
    display: none;
    line-height: 1.7;
    box-shadow: var(--shadow-tooltip);
    max-width: 240px;
  }
  .tooltip b { color: var(--ink-200); font-weight: 500; }

  /* ─── LOADING ───────────────────────────────────────────────────── */
  .loading-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 20px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 12px;
  }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--ink-100);
    border-top-color: var(--ink-500);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .main { padding: 16px 16px 32px; }
    .header { padding: 0 16px; }
  }
  @media (max-width: 500px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .section-head { flex-direction: column; align-items: flex-start; }
    .section-controls { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>

<header class="header" role="banner">
  <div class="header-brand">
    <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
    <h1>Tablero de disponibilidad — Profesores</h1>
  </div>
  <div class="header-right">
    <span class="header-meta" id="update-time"></span>
    <button class="btn-refresh" id="btn-refresh" title="Recargar datos">
      <i class="ti ti-refresh" aria-hidden="true"></i> Actualizar
    </button>
  </div>
</header>

<main class="main" role="main">

  <div class="status-banner" id="status-banner"></div>

  <!-- KPIs -->
  <div class="kpi-grid" aria-label="Indicadores clave">
    <div class="kpi">
      <div class="kpi-label"><i class="ti ti-users" aria-hidden="true"></i> Profesores</div>
      <div class="kpi-value" id="kpi-total">—</div>
      <div class="kpi-sub">respuestas registradas</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><i class="ti ti-calendar-check" aria-hidden="true"></i> Módulo top</div>
      <div class="kpi-value kpi-value--text" id="kpi-top-mod">—</div>
      <div class="kpi-sub" id="kpi-top-mod-sub">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><i class="ti ti-sun" aria-hidden="true"></i> Día top</div>
      <div class="kpi-value kpi-value--text" id="kpi-top-day">—</div>
      <div class="kpi-sub" id="kpi-top-day-sub">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><i class="ti ti-clock" aria-hidden="true"></i> Slots totales</div>
      <div class="kpi-value" id="kpi-slots">—</div>
      <div class="kpi-sub">en toda la semana</div>
    </div>
  </div>

  <!-- HEATMAP -->
  <div class="section-head">
    <div class="section-title">
      <i class="ti ti-table-heat" aria-hidden="true"></i>
      Mapa de calor — disponibilidad por módulo y día
    </div>
    <div class="section-controls">
      <div class="legend" aria-label="Leyenda">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--heat-0);border:1px solid var(--border-subtle);"></span> 0</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--heat-2);"></span> bajo</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--heat-4);"></span> medio</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--heat-6);"></span> alto</span>
      </div>
      <div class="filters" id="day-filters" role="group" aria-label="Filtros por día"></div>
    </div>
  </div>

  <div class="heatmap-wrap" id="heatmap-wrap">
    <table class="heatmap-table" aria-label="Disponibilidad por módulo y día">
      <thead id="heatmap-head"></thead>
      <tbody id="heatmap-body"></tbody>
      <tfoot id="heatmap-foot"></tfoot>
    </table>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-title"><i class="ti ti-award" aria-hidden="true"></i> Mayor disponibilidad</div>
      <div id="top-profs"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-chart-bar" aria-hidden="true"></i> Disponibilidad total por día</div>
      <div class="bar-chart" id="day-bars"></div>
    </div>
  </div>

</main>

<script>
/**
 * ═══════════════════════════════════════════════════════════════════
 * TABLERO DE DISPONIBILIDAD — PROFESORES
 * ═══════════════════════════════════════════════════════════════════
 *
 * Lee datos en tiempo real desde Google Sheets (publicada como CSV).
 *
 * SETUP:
 *   1. El formulario envía datos a Google Sheets via Apps Script
 *   2. La hoja tiene columnas: timestamp, nombre, asignatura, email,
 *      programa, y luego una columna por cada combo día-módulo
 *      (ej: "Lunes_M1", "Lunes_M2", ..., "Sábado_M8") con TRUE/FALSE
 *   3. Publicar la hoja: Archivo → Compartir → Publicar en la web → CSV
 *   4. Pegar la URL aquí abajo
 */

// ══════════════════════════════════════════════════════════════════
// ⚠️  REEMPLAZAR CON TU URL DE GOOGLE SHEETS PUBLICADA COMO CSV
// ══════════════════════════════════════════════════════════════════
const SHEET_CSV_URL = '';
// Ejemplo: 'https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv'
// ══════════════════════════════════════════════════════════════════


// ════════════════════════════════════════════════════════════════════
// 1. CONFIG
// ════════════════════════════════════════════════════════════════════

const CONFIG = {
  dias: ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
  modulos: [
    { id: 'M1',  nombre: 'Módulo 1',  hora: '08:30 – 09:40' },
    { id: 'M2',  nombre: 'Módulo 2',  hora: '10:00 – 11:10' },
    { id: 'M3',  nombre: 'Módulo 3',  hora: '11:30 – 12:40' },
    { id: 'M4A', nombre: 'Módulo 4A', hora: '13:00 – 14:10' },
    { id: 'M4B', nombre: 'Módulo 4B', hora: '13:30 – 14:40' },
    { id: 'M5',  nombre: 'Módulo 5',  hora: '15:00 – 16:10' },
    { id: 'M6',  nombre: 'Módulo 6',  hora: '16:30 – 17:40' },
    { id: 'M7',  nombre: 'Módulo 7',  hora: '18:00 – 19:10' },
    { id: 'M8',  nombre: 'Módulo 8',  hora: '19:30 – 20:40' },
  ],
  heatThresholds: [
    { max: 0,    cls: 'h0' },
    { max: 0.12, cls: 'h1' },
    { max: 0.25, cls: 'h2' },
    { max: 0.40, cls: 'h3' },
    { max: 0.60, cls: 'h4' },
    { max: 0.80, cls: 'h5' },
  ],
  heatDefault: 'h6',
  badgeThresholds: {
    high: { min: 60, cls: 'badge-high', label: 'Alta' },
    med:  { min: 30, cls: 'badge-med',  label: 'Media' },
    low:  { min: 0,  cls: 'badge-low',  label: 'Baja' },
  },
  topProfCount: 8,
  refreshInterval: 5 * 60 * 1000,  // Auto-refresh cada 5 min
};


// ════════════════════════════════════════════════════════════════════
// 2. DATA LAYER — Carga y parseo de Google Sheets CSV
// ════════════════════════════════════════════════════════════════════

/**
 * Parsea un CSV básico (maneja comillas y comas dentro de campos).
 * @param {string} csv - Texto CSV
 * @returns {string[][]} Filas como arrays de strings
 */
function parseCSV(csv) {
  const rows = [];
  let current = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < csv.length; i++) {
    const ch = csv[i];
    const next = csv[i + 1];

    if (inQuotes) {
      if (ch === '"' && next === '"') {
        field += '"';
        i++;
      } else if (ch === '"') {
        inQuotes = false;
      } else {
        field += ch;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        current.push(field);
        field = '';
      } else if (ch === '\n' || (ch === '\r' && next === '\n')) {
        current.push(field);
        field = '';
        if (current.length > 1) rows.push(current);
        current = [];
        if (ch === '\r') i++;
      } else {
        field += ch;
      }
    }
  }
  // Last field
  if (field || current.length > 0) {
    current.push(field);
    if (current.length > 1) rows.push(current);
  }

  return rows;
}

/**
 * Convierte las filas CSV en objetos de profesor.
 *
 * Formato esperado de la hoja:
 *   Columna 0: timestamp
 *   Columna 1: nombre
 *   Columna 2: asignatura
 *   Columna 3: email
 *   Columna 4: programa
 *   Columnas 5+: una por cada combo día_módulo → "Lunes_M1", "Lunes_M2", ...
 *                con valores "TRUE" o "FALSE"
 *
 * @param {string[][]} rows - Filas del CSV (incluye header)
 * @returns {Array} Lista de profesores en formato estándar
 */
function csvToProfesores(rows) {
  if (rows.length < 2) return [];

  const headers = rows[0].map(h => h.trim());
  const profesores = [];

  // Build column index map for day_module combos
  const colMap = {};
  CONFIG.dias.forEach(dia => {
    CONFIG.modulos.forEach((mod, mi) => {
      const key = `${dia}_${mod.id}`;
      const idx = headers.indexOf(key);
      if (idx >= 0) colMap[`${dia}_${mi}`] = idx;
    });
  });

  // Deduplicate by email: keep latest entry per email
  const byEmail = new Map();

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const nombre = (row[1] || '').trim();
    const asignatura = (row[2] || '').trim();
    const email = (row[3] || '').trim().toLowerCase();

    if (!nombre) continue;

    const disponibilidad = {};
    CONFIG.dias.forEach((dia, di) => {
      disponibilidad[dia] = CONFIG.modulos.map((_, mi) => {
        const colKey = `${dia}_${mi}`;
        const colIdx = colMap[colKey];
        if (colIdx === undefined) return false;
        const val = (row[colIdx] || '').trim().toUpperCase();
        return val === 'TRUE' || val === '1' || val === 'SÍ' || val === 'SI';
      });
    });

    const prof = { nombre, asignatura, email, disponibilidad };
    const dedupeKey = email || `${nombre}_${r}`; // fallback if no email
    byEmail.set(dedupeKey, prof);
  }

  return Array.from(byEmail.values());
}

/**
 * Carga profesores desde Google Sheets o genera datos demo.
 * @returns {Promise<{profesores: Array, source: string}>}
 */
async function loadData() {
  if (!SHEET_CSV_URL) {
    return { profesores: generateDemoData(), source: 'demo' };
  }

  try {
    const cacheBust = `&_t=${Date.now()}`;
    const url = SHEET_CSV_URL.includes('?')
      ? SHEET_CSV_URL + cacheBust
      : SHEET_CSV_URL + '?_t=' + Date.now();

    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const csv = await response.text();
    const rows = parseCSV(csv);
    const profesores = csvToProfesores(rows);

    if (profesores.length === 0) {
      return { profesores: [], source: 'empty' };
    }

    return { profesores, source: 'live' };

  } catch (err) {
    console.error('Error cargando datos:', err);
    return { profesores: generateDemoData(), source: 'error' };
  }
}

// ════════════════════════════════════════════════════════════════════
// 3. ENGINE — Funciones puras
// ════════════════════════════════════════════════════════════════════

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function calcCounts(profesores, diasFiltro) {
  const counts = {};
  const totalesDia = {};
  for (const dia of diasFiltro) {
    totalesDia[dia] = 0;
    counts[dia] = new Array(CONFIG.modulos.length).fill(0);
  }
  for (const prof of profesores) {
    for (const dia of diasFiltro) {
      const disp = prof.disponibilidad[dia];
      if (!disp) continue;
      for (let mi = 0; mi < disp.length; mi++) {
        if (disp[mi]) { counts[dia][mi]++; totalesDia[dia]++; }
      }
    }
  }
  return { counts, totalesDia };
}

function totalPorModulo(counts, diasFiltro) {
  return CONFIG.modulos.map((_, mi) =>
    diasFiltro.reduce((s, d) => s + (counts[d]?.[mi] || 0), 0));
}

function heatClass(val, max) {
  if (max === 0 || val === 0) return 'h0';
  const r = val / max;
  for (let i = 1; i < CONFIG.heatThresholds.length; i++) {
    if (r < CONFIG.heatThresholds[i].max) return CONFIG.heatThresholds[i].cls;
  }
  return CONFIG.heatDefault;
}

function badgeInfo(pct) {
  const { high, med, low } = CONFIG.badgeThresholds;
  return pct > high.min ? high : pct > med.min ? med : low;
}

function getInitials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0] || '').join('');
}

// 4. UI

let activeDias = [...CONFIG.dias];
let PROFESORES = [];

const DOM = {
  tooltip:      document.getElementById('tooltip'),
  kpiTotal:     document.getElementById('kpi-total'),
  kpiSlots:     document.getElementById('kpi-slots'),
  kpiTopMod:    document.getElementById('kpi-top-mod'),
  kpiTopModSub: document.getElementById('kpi-top-mod-sub'),
  kpiTopDay:    document.getElementById('kpi-top-day'),
  kpiTopDaySub: document.getElementById('kpi-top-day-sub'),
  updateTime:   document.getElementById('update-time'),
  heatHead:     document.getElementById('heatmap-head'),
  heatBody:     document.getElementById('heatmap-body'),
  heatFoot:     document.getElementById('heatmap-foot'),
  heatWrap:     document.getElementById('heatmap-wrap'),
  topProfs:     document.getElementById('top-profs'),
  dayBars:      document.getElementById('day-bars'),
  statusBanner: document.getElementById('status-banner'),
  btnRefresh:   document.getElementById('btn-refresh'),
};

function showStatus(msg, type) {
  DOM.statusBanner.textContent = msg;
  DOM.statusBanner.className = 'status-banner ' + type;
}

function hideStatus() {
  DOM.statusBanner.className = 'status-banner';
}

// ── Render functions ────────────────────────────────────────────

function renderKPIs(n, totalSlots, modTotales, totalesDia) {
  DOM.kpiTotal.textContent = n;
  DOM.kpiSlots.textContent = totalSlots.toLocaleString('es-CL');

  if (n === 0) {
    DOM.kpiTopMod.textContent = '—';
    DOM.kpiTopModSub.textContent = '—';
    DOM.kpiTopDay.textContent = '—';
    DOM.kpiTopDaySub.textContent = '—';
    return;
  }

  const topModIdx = modTotales.indexOf(Math.max(...modTotales));
  DOM.kpiTopMod.textContent = CONFIG.modulos[topModIdx].nombre;
  DOM.kpiTopModSub.textContent = `${modTotales[topModIdx]} slots disponibles`;

  if (activeDias.length > 0) {
    const topDia = activeDias.reduce((a, b) => totalesDia[a] >= totalesDia[b] ? a : b);
    DOM.kpiTopDay.textContent = topDia;
    DOM.kpiTopDaySub.textContent = `${totalesDia[topDia]} slots ese día`;
  }
}

function renderHeatmap(n, counts, maxCell, modTotales, totalesDia, totalSlots) {
  DOM.heatHead.innerHTML =
    '<tr><th class="col-module">Módulo</th>' +
    activeDias.map(d => `<th>${escapeHTML(d)}</th>`).join('') +
    '<th>Total</th></tr>';

  DOM.heatBody.innerHTML = CONFIG.modulos.map((mod, mi) => {
    const cells = activeDias.map(dia => {
      const val = counts[dia][mi];
      const cls = heatClass(val, maxCell);
      const pct = n > 0 ? Math.round(val / n * 100) : 0;
      return `<td><div class="heat-cell ${cls}"
        data-dia="${escapeHTML(dia)}" data-mod="${escapeHTML(mod.nombre)}"
        data-val="${val}" data-pct="${pct}" data-total="${n}"
        role="gridcell" aria-label="${val} disponibles ${dia} ${mod.nombre} (${pct}%)">
        <span class="count">${val}</span><span class="pct">${pct}%</span>
      </div></td>`;
    }).join('');
    const tot = modTotales[mi];
    const totPct = activeDias.length > 0 && n > 0 ? Math.round(tot / (n * activeDias.length) * 100) : 0;
    return `<tr><td class="cell-module"><div class="mod-name">${escapeHTML(mod.nombre)}</div><div class="mod-time">${escapeHTML(mod.hora)}</div></td>${cells}<td class="cell-mod-total"><div class="cell-mod-total-count">${tot}</div><div class="cell-mod-total-pct">${totPct}%</div></td></tr>`;
  }).join('');

  DOM.heatFoot.innerHTML =
    '<tr class="row-totals"><td class="cell-total-label">Total por día</td>' +
    activeDias.map(d => `<td class="cell-total-val">${totalesDia[d]}</td>`).join('') +
    `<td class="cell-total-val cell-grand-total">${totalSlots}</td></tr>`;
}

function renderTopProfesores() {
  const maxSlots = activeDias.length * CONFIG.modulos.length;
  const ranked = PROFESORES.map(p => {
    const slots = activeDias.reduce((s, dia) =>
      s + (p.disponibilidad[dia] || []).filter(Boolean).length, 0);
    return { ...p, slots };
  }).sort((a, b) => b.slots - a.slots).slice(0, CONFIG.topProfCount);

  DOM.topProfs.innerHTML = ranked.map(p => {
    const pct = maxSlots > 0 ? Math.round(p.slots / maxSlots * 100) : 0;
    const b = badgeInfo(pct);
    return `<div class="prof-row">
      <div class="prof-avatar">${escapeHTML(getInitials(p.nombre))}</div>
      <div><div class="prof-name">${escapeHTML(p.nombre)}</div><div class="prof-area">${escapeHTML(p.asignatura)}</div></div>
      <div class="prof-slots"><span class="badge ${b.cls}">${p.slots} slots · ${b.label}</span></div>
    </div>`;
  }).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Sin datos</div>';
}

function renderDayBars(totalesDia) {
  const maxDay = Math.max(...CONFIG.dias.map(d => totalesDia[d] || 0), 1);
  DOM.dayBars.innerHTML = CONFIG.dias.map(dia => {
    const val = totalesDia[dia] || 0;
    const isActive = activeDias.includes(dia);
    const w = Math.round(val / maxDay * 100);
    return `<div class="bar-row">
      <div class="bar-day">${escapeHTML(dia.slice(0, 3))}</div>
      <div class="bar-track"><div class="bar-fill ${isActive ? '' : 'bar-fill--inactive'}" style="width:${w}%">${w > 15 ? `<span>${val}</span>` : ''}</div></div>
      <div class="bar-val ${isActive ? '' : 'bar-val--inactive'}">${val}</div>
    </div>`;
  }).join('');
}

function render() {
  const n = PROFESORES.length;
  const { counts, totalesDia } = calcCounts(PROFESORES, activeDias);
  const maxCell = Math.max(...activeDias.flatMap(d => counts[d]), 0);
  const modTotales = totalPorModulo(counts, activeDias);
  const totalSlots = Object.values(totalesDia).reduce((a, b) => a + b, 0);

  renderKPIs(n, totalSlots, modTotales, totalesDia);
  renderHeatmap(n, counts, maxCell, modTotales, totalesDia, totalSlots);
  renderTopProfesores();
  renderDayBars(totalesDia);
}


// ── Tooltip (delegated) ─────────────────────────────────────────

DOM.heatBody.addEventListener('mouseenter', function (e) {
  const cell = e.target.closest('.heat-cell');
  if (!cell) return;
  const { dia, mod, val, pct, total } = cell.dataset;
  DOM.tooltip.innerHTML = `<b>${escapeHTML(dia)} · ${escapeHTML(mod)}</b><br>${val} profesores disponibles<br>${pct}% del total (${total})`;
  DOM.tooltip.style.display = 'block';
  DOM.tooltip.setAttribute('aria-hidden', 'false');
  const rect = cell.getBoundingClientRect();
  const ttW = DOM.tooltip.offsetWidth;
  const ttH = DOM.tooltip.offsetHeight;
  let left = rect.left + rect.width / 2 - ttW / 2;
  let top = rect.top - ttH - 8;
  left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));
  if (top < 8) top = rect.bottom + 8;
  DOM.tooltip.style.left = left + 'px';
  DOM.tooltip.style.top = top + 'px';
}, true);

DOM.heatBody.addEventListener('mouseleave', function (e) {
  if (e.target.closest('.heat-cell')) {
    DOM.tooltip.style.display = 'none';
    DOM.tooltip.setAttribute('aria-hidden', 'true');
  }
}, true);


// ── Day Filters ─────────────────────────────────────────────────

const filtersEl = document.getElementById('day-filters');
CONFIG.dias.forEach(dia => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = dia.slice(0, 3);
  btn.setAttribute('aria-pressed', 'true');
  btn.setAttribute('aria-label', `Filtrar ${dia}`);
  btn.addEventListener('click', () => {
    if (activeDias.includes(dia)) {
      if (activeDias.length === 1) return;
      activeDias = activeDias.filter(d => d !== dia);
      btn.setAttribute('aria-pressed', 'false');
    } else {
      activeDias.push(dia);
      activeDias.sort((a, b) => CONFIG.dias.indexOf(a) - CONFIG.dias.indexOf(b));
      btn.setAttribute('aria-pressed', 'true');
    }
    render();
  });
  filtersEl.appendChild(btn);
});


// ── Data Loading & Refresh ──────────────────────────────────────

function showLoading() {
  DOM.heatWrap.innerHTML =
    '<div class="loading-overlay"><div class="loading-spinner"></div><span>Cargando datos…</span></div>';
}

async function refreshData() {
  DOM.btnRefresh.classList.add('loading');

  const { profesores, source } = await loadData();
  PROFESORES = profesores;

  const now = new Date().toLocaleString('es-CL', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });

  switch (source) {
    case 'live':
      hideStatus();
      DOM.updateTime.textContent = `Actualizado · ${now}`;
      break;
    case 'empty':
      showStatus('La hoja de cálculo no tiene respuestas aún. Se muestran datos de ejemplo.', 'info');
      PROFESORES = generateDemoData();
      DOM.updateTime.textContent = `Demo · ${now}`;
      break;
    case 'error':
      showStatus('No se pudo conectar a Google Sheets. Se muestran datos de ejemplo.', 'error');
      DOM.updateTime.textContent = `Demo (offline) · ${now}`;
      break;
    case 'demo':
      showStatus('⚙️ SHEET_CSV_URL no configurada. Configura la conexión a Google Sheets para ver datos reales. Se muestran datos de ejemplo.', 'demo');
      DOM.updateTime.textContent = `Datos de ejemplo · ${now}`;
      break;
  }

  // Restore the heatmap table structure if it was replaced by loading
  if (!document.getElementById('heatmap-head')) {
    DOM.heatWrap.innerHTML =
      '<table class="heatmap-table" aria-label="Disponibilidad por módulo y día">' +
      '<thead id="heatmap-head"></thead><tbody id="heatmap-body"></tbody><tfoot id="heatmap-foot"></tfoot></table>';
    DOM.heatHead = document.getElementById('heatmap-head');
    DOM.heatBody = document.getElementById('heatmap-body');
    DOM.heatFoot = document.getElementById('heatmap-foot');

    // Re-attach tooltip delegation
    DOM.heatBody.addEventListener('mouseenter', function (e) {
      const cell = e.target.closest('.heat-cell');
      if (!cell) return;
      const { dia, mod, val, pct, total } = cell.dataset;
      DOM.tooltip.innerHTML = `<b>${escapeHTML(dia)} · ${escapeHTML(mod)}</b><br>${val} profesores disponibles<br>${pct}% del total (${total})`;
      DOM.tooltip.style.display = 'block';
      const rect = cell.getBoundingClientRect();
      const ttW = DOM.tooltip.offsetWidth;
      const ttH = DOM.tooltip.offsetHeight;
      let left = rect.left + rect.width / 2 - ttW / 2;
      let top = rect.top - ttH - 8;
      left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));
      if (top < 8) top = rect.bottom + 8;
      DOM.tooltip.style.left = left + 'px';
      DOM.tooltip.style.top = top + 'px';
    }, true);
    DOM.heatBody.addEventListener('mouseleave', function (e) {
      if (e.target.closest('.heat-cell')) DOM.tooltip.style.display = 'none';
    }, true);
  }

  render();
  DOM.btnRefresh.classList.remove('loading');
}

// Refresh button
DOM.btnRefresh.addEventListener('click', refreshData);

// Auto-refresh
setInterval(refreshData, CONFIG.refreshInterval);

// Initial load
showLoading();
refreshData();

</script>
